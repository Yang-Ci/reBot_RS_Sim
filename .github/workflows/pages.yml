name: Deploy B601-RS-Sim to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web_mujoco/package-lock.json
      - name: Install dependencies
        working-directory: web_mujoco
        run: npm ci
      - name: Install browser for RGB-D verification
        working-directory: web_mujoco
        run: npx playwright install --with-deps chromium
      - name: Verify actual dual-arm interface
        working-directory: web_mujoco
        run: npm run test:visual-ui
      - name: Verify camera interaction and live previews
        working-directory: web_mujoco
        run: npm run test:camera
      - name: Verify timing, grasping and randomized cooperation
        working-directory: web_mujoco
        run: npm run test:ci
      - name: Verify model loading and resource cleanup
        working-directory: web_mujoco
        run: npm run test:loading
      - name: Verify contact-only grasp, slip stops and composed return task
        working-directory: web_mujoco
        run: npm run test:contact
      - name: Verify asynchronous large-WASM delivery
        working-directory: web_mujoco
        run: npm run test:delivery
      - name: Verify rendered RGB-D closed loop
        working-directory: web_mujoco
        run: npm run test:vision
      - name: Verify lighting, materials, cup styles and composed RGB-D task
        working-directory: web_mujoco
        run: npm run test:vision:extended && npm run test:vision:return
      - name: Upload cooperation benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cooperation-benchmark
          path: web_mujoco/.reports/*.json
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Build for GitHub Pages
        working-directory: web_mujoco
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_mujoco/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
